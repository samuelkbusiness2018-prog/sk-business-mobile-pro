
name: Build Sk Business Mobile Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project archive
        run: unzip -q Sk_Business_Mobile_Pro_source.zip -d project

      - name: Build debug APK
        run: gradle -p project/sk_business_mobile_pro assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sk-Business-Mobile-Pro-debug-APK
          path: project/sk_business_mobile_pro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
